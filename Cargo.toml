[package]
name = "rustdesk-account-server"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Small independent account API for unmodified RustDesk clients"
rust-version = "1.98"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
ipnet = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "net", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["limit", "util"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
