name: Account server release (draft only)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: account-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'GX-Swjtu/rustdesk-account-server' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Validate tag and reject published releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts -p test_release.py
          python3 scripts/release.py validate
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      source-ref: ${{ github.sha }}
  draft:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: account-*
          merge-multiple: true
          path: dist/release
      - name: Generate checksums and unpublished bilingual release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py draft
