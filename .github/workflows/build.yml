name: Account server build (artifacts only)
on:
  push:
    branches: ['build/account/**']
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: GX-Swjtu/rustdesk-account-server
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Package binary, license and deployment examples
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python scripts/release.py package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: GX-Swjtu/rustdesk-account-server
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      - name: Build and check deployment image
        run: |
          version=$(python3 -c "import runpy; print(runpy.run_path('scripts/release.py')['VERSION'])")
          docker build --target final -t "rustdesk-account-server:${version}" .
          docker run --rm "rustdesk-account-server:${version}" --help
          mkdir -p dist/release
          docker save "rustdesk-account-server:${version}" | gzip > "dist/release/rustdesk-account-server-${version}-docker-linux-x86_64.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-container
          path: dist/release/*
          if-no-files-found: error
